name: Build installer

# Compila l'installer NSIS su un runner Windows: nessun PC di build necessario.
#  - push di un tag v*  -> compila e allega l'exe alla release
#  - "Run workflow"     -> compila e basta, l'exe resta come artifact per 90 giorni
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package-lock.json e' versionato: npm ci installa le versioni esatte del lock,
      # cosi' la build e' riproducibile e non cambia sotto i piedi a ogni patch release.
      - name: Installa le dipendenze
        run: npm ci --no-audit --no-fund

      # Il main process non viene mai eseguito durante il packaging: senza questo
      # passo un errore di sintassi finirebbe dritto dentro l'installer.
      - name: Controllo di sintassi
        run: node --check main.js && node --check preload.js && node --check password.js && node --check settings.js

      # Carica davvero password.html e settings.html in finestre nascoste e verifica
      # preload, CSP, rendering e validazione degli URL prima di impacchettare.
      - name: Test delle finestre di servizio
        run: npm test

      # Avvia il main process vero in una userData temporanea e controlla dal log che l'avvio
      # arrivi in fondo e che il recupero da host irraggiungibile scatti.
      - name: Test di avvio del main process
        run: npm run test:avvio

      - name: Compila l'installer NSIS
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Elenca il risultato
        shell: pwsh
        run: Get-ChildItem dist -Filter *.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: UniFi_Monitor_installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Allega alla release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = (Get-ChildItem dist -Filter *.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "nessun .exe in dist/" }
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $exe --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $exe --title $env:GITHUB_REF_NAME --notes-file CHANGELOG.md
          }
