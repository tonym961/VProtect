<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Accesso Protetto</title>
<style>
  body { font-family: sans-serif; padding: 20px; text-align: center; background: #f0f0f0; border: 3px solid #333; margin: 0; }
  #errorMsg { color: red; font-size: 12px; height: 20px; visibility: hidden; }
  .campo { display: flex; align-items: center; background: white; border: 1px solid #ccc; border-radius: 4px; padding: 2px 10px; margin-bottom: 20px; }
  #pass { border: none; outline: none; padding: 10px; flex-grow: 1; font-size: 16px; }
  #occhio { cursor: pointer; font-size: 18px; padding: 0 5px; user-select: none; }
  button { padding: 10px 25px; border: none; cursor: pointer; border-radius: 4px; color: white; }
  #accedi { background: #5cb85c; font-weight: bold; }
  #esci { background: #777; }
</style>
</head>
<body>
  <h3>🔒 Accesso Protetto</h3>
  <div id="errorMsg">Password Errata!</div>
  <div class="campo">
    <input type="password" id="pass" autofocus placeholder="Password...">
    <span id="occhio">👁️</span>
  </div>
  <button id="accedi">Accedi</button>
  <button id="esci">Esci</button>
<script src="password.js"></script>
</body>
</html>
